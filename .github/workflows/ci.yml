name: CI

on:
  push:
    branches: [main, starter-kit-v1]
  pull_request:

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno test --allow-env supabase/functions

      - name: Smoke test
        run: deno task smoke

  # Advisory: lint the SQL migration. Non-blocking — `supabase db lint` needs a
  # running database, which we don't spin up in CI yet (see ROADMAP.md).
  migration-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db lint --level warning || true
